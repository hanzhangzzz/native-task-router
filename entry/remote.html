<!doctype html>
<!-- 手机远程入口：Mac 上 Native Task Router 的 127.0.0.1 服务经反向隧道挂到你自己服务器的 HTTPS 后面。
     首次打开：地址栏带令牌（#xxx）会自动存好并抹掉；之后直接用。令牌只存本机 localStorage。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Native Task Router</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: max(12px, env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom)); font: 15px/1.5 -apple-system, "PingFang SC", sans-serif; background: #1c1c1e; color: #f2f2f7; }
  h1 { font-size: 17px; margin: 2px 0 12px; display: flex; align-items: center; gap: 8px; }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #30d158; }
  h1 .dot.bad { background: #ff453a; }
  #wrap { max-width: 640px; margin: 0 auto; }
  textarea { width: 100%; min-height: 64px; border-radius: 12px; border: 1px solid #3a3a3c; background: #2c2c2e; color: inherit; padding: 10px 12px; font: inherit; resize: vertical; }
  .row { display: flex; gap: 8px; margin: 8px 0 14px; }
  button { border: 0; border-radius: 12px; background: #0a84ff; color: #fff; font: inherit; padding: 10px 16px; }
  button.sec { background: #48484a; }
  button.big { width: 100%; padding: 13px; font-size: 16px; }
  button:disabled { opacity: .5; cursor: wait; }
  button.loading::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid #ffffff55; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button:active { opacity: .7; }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: #3a3a3c; border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 13px; margin: 0 8px 8px 0; }
  .chip b { font-weight: 500; }
  .chip button { background: none; padding: 4px 9px; color: #bbb; font-size: 15px; }
  .result { border-radius: 12px; padding: 10px 12px; margin: 10px 0; background: #2c2c2e; white-space: pre-wrap; word-break: break-word; }
  .result.fail { color: #ff9f0a; }
  .q { font-weight: 600; }
  .ctx { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #98989d; margin: 4px 0; }
  .opts button { display: block; width: 100%; text-align: left; margin: 6px 0; background: #3a3a3c; }
  .task { border-radius: 12px; background: #2c2c2e; padding: 10px 12px; margin: 8px 0; }
  .task .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .task .name { font-weight: 600; }
  .task .proj { color: #98989d; font-size: 13px; }
  .badge { flex: none; font-size: 12px; border-radius: 999px; padding: 1px 8px; background: #48484a; color: #ddd; }
  .badge.busy { background: #5e5ce6; color: #fff; }
  .badge.wait { background: #ff9f0a; color: #1c1c1e; }
  .task .last { color: #98989d; font-size: 13px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: #98989d; font-size: 12px; margin: 14px 0 4px; }
  #gate input { width: 100%; border-radius: 12px; border: 1px solid #3a3a3c; background: #2c2c2e; color: inherit; padding: 10px 12px; font: inherit; }
</style>
</head>
<body>
<div id="wrap">
  <div id="gate" hidden>
    <h1>Native Task Router</h1>
    <p id="gateTip" style="color:#98989d"></p>
    <input id="tokIn" placeholder="token" autocapitalize="off" autocomplete="off">
    <div class="row"><button id="tokSave" class="big"></button></div>
  </div>
  <div id="main" hidden>
    <h1><span class="dot" id="dot"></span><span id="conn">…</span></h1>
    <div id="target"></div>
    <textarea id="in" placeholder=""></textarea>
    <div class="row"><button id="send" class="big"></button></div>
    <div id="out"></div>
    <div class="sub" id="tasksHead"></div>
    <div class="row"><button id="refresh" class="sec"></button></div>
    <div id="tasks"></div>
  </div>
</div>
<script>
const S = {
  zh: { send: '送到 Mac', sending: '正在送到 Mac…', nativeState: '待选择', nativeWait: '已交给原生 CLI，等待 Mac 上的选择；尚未确认开始执行。请在 Mac 终端处理。', ph: '说一句话，路由到 Mac 上对的会话…', tasks: 'Mac 上的任务', refresh: '刷新', ok: '已连上 Mac', bad: '连不上（Mac 睡了？隧道断了？）',
    gate: '粘贴 Mac 菜单栏「手机远程 → 复制手机链接」里 # 后面的那串令牌：', save: '保存', clear: '新会话', wait: '等批准', busy: '忙', new: '新建', pick: '选定目标', none: '(无标题)' },
  en: { send: 'Send to Mac', sending: 'Sending to Mac…', nativeState: 'Needs choice', nativeWait: 'Handed to the native CLI; waiting for a choice on your Mac. Execution has not been confirmed. Continue in the Mac terminal.', ph: 'One sentence, routed to the right session on your Mac…', tasks: 'Tasks on your Mac', refresh: 'Refresh', ok: 'Mac connected', bad: "Can't reach the Mac (asleep? tunnel down?)",
    gate: 'Paste the token after # from the Mac menu bar item:', save: 'Save', clear: 'New', wait: 'Awaiting approval', busy: 'Busy', new: 'New session', pick: 'Picked target', none: '(untitled)' },
};
const L = (navigator.language || 'zh').toLowerCase().startsWith('zh') ? S.zh : S.en;
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('ntr-token') || '';
let target = null;      // {provider,sessionId,card} | {new:true,provider,cwd}
let busy = false;
function setBusy(value) { busy = value; $('send').disabled = value; $('send').classList.toggle('loading', value); $('send').textContent = value ? L.sending : L.send; $('send').setAttribute('aria-busy', String(value)); }
let pendingText = '';   // 等批准/拿不准时扣住的正文，选完选项后接着送
function api(path, body) {
  return fetch(path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + token, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined })
    .then(async (r) => { const o = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(o.error || r.status), { status: r.status }); return o; });
}
// 令牌：地址栏 #token 优先（复制链接直接打开），存 localStorage 后抹掉地址栏
(function () {
  const h = location.hash.slice(1).trim();
  if (h && /^[0-9a-f]{16,}$/i.test(h)) { token = h; localStorage.setItem('ntr-token', h); history.replaceState(null, '', '/'); }
  if (!token) { $('gate').hidden = false; $('gateTip').textContent = L.gate; $('tokSave').textContent = L.save; $('tokSave').onclick = () => { const v = $('tokIn').value.trim(); if (v) { token = v; localStorage.setItem('ntr-token', v); location.hash = ''; boot(); } }; return; }
  boot();
})();
function boot() { $('gate').hidden = true; $('main').hidden = false; render(); $('send').textContent = L.send; $('refresh').textContent = L.refresh; $('tasksHead').textContent = L.tasks; $('in').placeholder = L.ph; poll(); setInterval(() => document.visibilityState === 'visible' && poll(), 15000); }
const label = (c) => c && c.card ? `${c.card.title || L.none} · ${c.card.project}` : (c && c.sessionId ? `${c.provider}:${c.card?.project || c.sessionId.slice(0, 8)}` : L.new);
function render() {
  const el = $('target');
  el.textContent = '';
  if (!target) return;
  const chip = document.createElement('span'); chip.className = 'chip';
  const b = document.createElement('b'); b.textContent = L.pick + '：';
  const name = document.createElement('span'); name.textContent = label(target);   // 会话标题来自历史内容，只走 textContent，绝不进 innerHTML
  const x = document.createElement('button'); x.textContent = '✕'; x.onclick = () => { target = null; render(); };
  chip.append(b, name, x);
  el.appendChild(chip);
}
window.__clearTarget = () => { target = null; render(); };
function result(r) {
  const out = $('out');
  if (!r) { out.innerHTML = ''; return; }
  if (r.action === 'awaiting-approval') {
    pendingText = '';
    const p = r.prompt || {};
    out.innerHTML = `<div class="result"><div class="q"></div><div class="ctx"></div><div class="opts"></div></div>`;
    out.querySelector('.q').textContent = p.question || L.wait;
    out.querySelector('.ctx').textContent = p.context || '';
    const opts = out.querySelector('.opts');
    (p.options || []).forEach((o, i) => { const b = document.createElement('button'); b.textContent = `${i + 1}. ${o.label || ''}`; b.onclick = () => answer(r, i + 1); opts.appendChild(b); });
    target = { provider: r.provider, sessionId: r.sessionId, card: r.card };
    return;
  }
  if (r.action === 'clarify') {
    pendingText = $('in').value.trim();
    const opts = (r.ranked && r.ranked.length ? r.ranked : r.options || []).slice(0, 8);
    const div = document.createElement('div'); div.className = 'result';
    const q = document.createElement('div'); q.className = 'q'; q.textContent = r.reason || ''; div.appendChild(q);
    const box = document.createElement('div'); box.className = 'opts';
    opts.forEach((o) => { if (!o || !o.provider) return; const b = document.createElement('button'); b.textContent = (o.kind === 'new' ? '＋ ' : '') + label(o); b.onclick = () => { target = o.kind === 'new' ? { new: true, provider: o.provider, cwd: o.cwd } : { provider: o.provider, sessionId: o.sessionId, card: o.card }; render(); submit(pendingText); }; box.appendChild(b); });
    const bn = document.createElement('button'); bn.textContent = '＋ ' + L.new; bn.onclick = () => { target = { new: true, provider: r.suggestNew?.provider || 'claude', cwd: r.suggestNew?.cwd }; render(); submit(pendingText); };
    box.appendChild(bn);
    div.appendChild(box); out.innerHTML = ''; out.appendChild(div);
    return;
  }
  out.innerHTML = `<div class="result${r.action === 'failed' ? ' fail' : ''}"></div>`;
  out.firstChild.textContent = r.nativePrompt ? L.nativeWait : r.line || r.action;
  if (r.action !== 'failed' && r.action !== 'focused-only') $('in').value = '';
  pendingText = '';
}
async function answer(r, n) {
  if (busy) return;
  setBusy(true);
  try { result(await api('/api/open', { target: { provider: r.provider, sessionId: r.sessionId, answer: n }, text: '' })); } catch (e) { result({ action: 'failed', line: String(e.message || e) }); }
  setBusy(false);
  poll();
}
async function submit(text) {
  if (busy || (!text && !target)) return;
  setBusy(true);
  try { result(await api('/api/open', { text, ...(target && !target.answer ? { target } : {}) })); } catch (e) { result({ action: 'failed', line: String(e.message || e) }); }
  setBusy(false);
  poll();
}
$('send').onclick = () => submit($('in').value.trim());
async function poll() {
  let ok = true;
  try { renderTasks(await api('/api/tasks')); } catch (e) { ok = false; }
  $('dot').className = 'dot' + (ok ? '' : ' bad');
  $('conn').textContent = ok ? L.ok : L.bad;
}
function renderTasks(o) {
  const el = $('tasks'); el.innerHTML = '';
  for (const t of (o.running || [])) {
    const d = document.createElement('div'); d.className = 'task';
    const badge = t.prompt || t.state === 'waiting' ? `<span class="badge wait">${t.nativeWaiting ? L.nativeState : L.wait}</span>` : t.state === 'busy' ? `<span class="badge busy">${L.busy}</span>` : '';
    d.innerHTML = `<div class="t"><span><span class="name"></span> <span class="proj"></span></span>${badge}</div><div class="last"></div>`;
    d.querySelector('.name').textContent = t.card?.title || t.viewTitle || t.provider || L.none;
    d.querySelector('.proj').textContent = t.card?.project || '';
    d.querySelector('.last').textContent = t.nativeWaiting ? L.nativeWait : t.prompt ? [t.prompt.question, t.prompt.context].filter(Boolean).join(' ') : (t.card?.reply || '').slice(0, 120);
    d.onclick = () => { if (t.nativeWaiting) return; target = { provider: t.provider, sessionId: t.sessionId, card: t.card }; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    if (!t.nativeWaiting && t.prompt && t.prompt.options) {
      const box = document.createElement('div'); box.className = 'opts';
      t.prompt.options.forEach((op, i) => { const b = document.createElement('button'); b.textContent = `${i + 1}. ${op.label || ''}`; b.onclick = (ev) => { ev.stopPropagation(); answer(t, i + 1); }; box.appendChild(b); });
      d.appendChild(box);
    }
    el.appendChild(d);
  }
}
$('refresh').onclick = poll;
</script>
</body>
</html>
