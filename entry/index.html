<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  /* 皮肤：结构与交互共用，每套皮肤（html[data-skin=…]）只改变量和少量装饰；不设 data-skin 即默认 aurora。
     窗口底下仍是 macOS 原生毛玻璃（BrowserWindow vibrancy）与系统圆角阴影，#box 自己铺皮肤底色。 */
  :root { --bg: rgba(20, 22, 32, .8); --edge: rgba(255, 255, 255, .08); --fg: #f2f3f8; --dim: rgba(235, 238, 245, .6); --faint: rgba(235, 238, 245, .4);
    --accent: #8b97ff; --accent2: #5fd4ff; --accent3: #ff7ab8; --err: #ff8f8f; --field: rgba(255, 255, 255, .06); --kbd: rgba(255, 255, 255, .09); --kbd-fg: rgba(255, 255, 255, .72);
    --sel: linear-gradient(90deg, rgba(139, 151, 255, .26), rgba(139, 151, 255, .08)); --sel-line: rgba(160, 170, 255, .22);
    --idle: #4cd38a; --busy: #5fd4ff; --wait: #ffb347;
    /* 项目标签按项目名哈希出色相 --h，皮肤可把色相压进自己的色域：hue0 + h × huek */
    --hue0: 0; --huek: 1; --chip-s: 90%; --chip-l: 78%; --chip-a: .15;
    --r: 10px; --font: -apple-system, "PingFang SC", sans-serif; --title-font: inherit; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --spring: cubic-bezier(.34, 1.45, .5, 1); color-scheme: dark; }
  html, body { margin: 0; background: transparent; font: 15px var(--font); color: var(--fg); -webkit-user-select: none; }
  #box { position: relative; padding: 15px 18px 13px; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden; isolation: isolate; }
  #box > * { position: relative; z-index: 1; }
  #box > #fx { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  /* 流动光边：只在路由判断进行中出现并旋转 */
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  #box::before { content: ''; position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), var(--accent), var(--accent2), var(--accent3), var(--accent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .25s; }
  body.thinking #box::before { opacity: .95; animation: flow 2.4s linear infinite; }
  @keyframes flow { to { --a: 360deg; } }
  /* 结果反馈：送达闪一下光，失败抖一下 */
  #box::after { content: ''; position: absolute; inset: 0; z-index: 2; border-radius: inherit; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 46px color-mix(in srgb, var(--accent) 55%, transparent); }
  body.ok #box::after { animation: ok .9s ease-out; }
  body.ok .mark { animation: markpop .6s var(--spring); }
  body.bad .row { animation: shake .36s; }
  @keyframes ok { 15% { opacity: .9; } 100% { opacity: 0; } }
  @keyframes markpop { 40% { transform: scale(1.22) rotate(-8deg); } }
  @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

  .row { display: flex; align-items: flex-start; gap: 12px; }
  .row textarea { margin-top: 1px; }
  .mark { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 7px; display: grid; place-items: center;
    font: 700 12px/1 var(--mono); letter-spacing: -1px; color: #fff;
    background: linear-gradient(135deg, var(--accent2), var(--accent) 55%, var(--accent3)); box-shadow: 0 3px 12px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 rgba(255, 255, 255, .3); }
  #target { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px; padding: 3px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); font-size: 12.5px; }
  #target[hidden] { display: none; }
  #target .hint { color: var(--faint); }
  textarea { display: block; flex: 1; width: 100%; box-sizing: border-box; background: transparent; border: 0; outline: 0; resize: none; overflow-y: hidden;
    color: inherit; caret-color: var(--accent); font: inherit; font-size: 20px; line-height: 1.4; padding: 0; margin: 0; }
  textarea::placeholder { color: var(--faint); }
  #msg { margin: 10px 0 0 38px; white-space: pre-wrap; color: var(--dim); font-size: 13px; line-height: 1.5; }
  #msg:empty { display: none; }
  #msg.err { color: var(--err); }
  #filter { display: block; width: 100%; box-sizing: border-box; margin: 10px 0 0; padding: 5px 10px; border: 0; outline: 0; border-radius: 7px;
    background: var(--field); color: inherit; font: inherit; font-size: 13px; caret-color: var(--accent); }
  #filter[hidden] { display: none; }
  #filter::placeholder { color: var(--faint); }
  #hint { margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--edge); color: var(--faint); font-size: 11.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  #hint:empty { display: none; }
  kbd { font: 10.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--kbd); color: var(--kbd-fg); margin-right: 4px; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .25); }

  /* 列表：一行 = 编号 · 标题 + 项目标签 + 工具徽标 · 副行 · 右侧状态/时间；选中高亮是一块常驻光块（li.hl），滑到选中行 */
  #list { position: relative; list-style: none; margin: 10px 0 0; padding: 0; }
  #list.none { display: none; }
  #list.scroll { max-height: 430px; overflow-y: auto; }
  #list li { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 10px; padding: 7px 12px 7px 10px; border-radius: var(--r); font-size: 14px; line-height: 1.4; }
  #list li + li:not(.hl + li) { margin-top: 2px; }
  #list li.hl { position: absolute; z-index: 0; left: 0; right: 0; top: 0; padding: 0; background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-line); pointer-events: none;
    transition: transform .34s var(--spring), height .24s ease; }
  #list li.hl[hidden] { display: none; }
  #list li.hl::before { content: ''; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: linear-gradient(var(--accent2), var(--accent)); box-shadow: 0 0 8px var(--accent); }
  #list li.sec { display: block; padding: 8px 12px 2px 10px; font-size: 11.5px; color: var(--faint); letter-spacing: .5px; }
  #list li.sec .n { margin-left: 6px; font: 600 10.5px var(--mono); padding: 0 6px; border-radius: 999px; background: var(--kbd); color: var(--kbd-fg); }
  .num { flex: none; width: 20px; height: 20px; margin-top: 0; border-radius: 6px; display: grid; place-items: center; font: 600 11px var(--mono); color: var(--kbd-fg); background: var(--kbd);
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .25); transition: background .2s, color .2s; }
  .num:empty { visibility: hidden; }
  li.sel .num { background: var(--accent); color: #fff; }
  .main { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--title-font); font-weight: 600; }
  .chip { flex: none; font-size: 11px; line-height: 16px; padding: 0 7px; border-radius: 999px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: hsl(calc(var(--hue0) + var(--h) * var(--huek)) var(--chip-s) var(--chip-l)); background: hsl(calc(var(--hue0) + var(--h) * var(--huek)) var(--chip-s) 58% / var(--chip-a)); }
  .prov { flex: none; width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; color: #111; }
  .prov.claude { background: #d97757; color: #fff; }
  .prov.codex { background: #ececec; }
  .prov svg { display: block; width: 10px; height: 10px; }
  .sub { margin-top: 2px; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.sel .sub.more { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .who { display: inline-block; font-size: 10px; line-height: 15px; padding: 0 5px; margin-right: 6px; border-radius: 4px; background: var(--kbd); color: var(--kbd-fg); vertical-align: 1px; }
  .who.it { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .meta { flex: none; display: flex; align-items: center; padding-top: 1px; font-size: 11.5px; color: var(--dim); }
  .time { color: var(--faint); font-size: 11px; }
  .st { display: flex; align-items: center; gap: 6px; }
  .st i { position: relative; width: 7px; height: 7px; border-radius: 50%; }
  .st.idle i { background: var(--idle); }
  .st.busy i { background: var(--busy); }
  .st.busy i::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--busy); animation: ripple 1.6s ease-out infinite; }
  .st.waiting { color: var(--wait); }
  .st.waiting i { background: var(--wait); animation: breathe 1.8s ease-in-out infinite; }
  .st.unknown i { box-shadow: inset 0 0 0 1.5px var(--faint); }
  @keyframes ripple { to { transform: scale(3); opacity: 0; } }
  @keyframes breathe { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--wait) 25%, transparent), 0 0 12px var(--wait); } }
  /* 运行中：行底一道流光；等你处理：整行轻轻呼吸 */
  li.busy::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 1px; opacity: .8;
    background: linear-gradient(90deg, transparent, var(--busy), var(--accent), transparent) 0 0 / 40% 100% no-repeat; animation: scan 2.2s ease-in-out infinite; }
  li.waiting { animation: wglow 1.8s ease-in-out infinite; }
  @keyframes scan { from { background-position: -60% 0; } to { background-position: 160% 0; } }
  @keyframes wglow { 50% { box-shadow: inset 3px 0 0 var(--wait); background: color-mix(in srgb, var(--wait) 4%, transparent); } }
  /* 列表出现时依次淡入（只在打开时播，打字筛选不重播） */
  #list.enter li:not(.hl) { animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0) * 28ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px); } } /* 从上方落入：向下位移会在动画期间撑出列表滚动条 */
  @keyframes blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* 选皮肤：顶部一排皮肤名，当前预览的高亮；下面是示例任务列表 */
  #skins { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; font-size: 12px; }
  #skins[hidden] { display: none; }
  #skins .lb { color: var(--faint); margin-right: 2px; }
  #skins .sk { padding: 2px 9px; border-radius: 999px; background: var(--kbd); color: var(--kbd-fg); transition: background .2s, color .2s; }
  #skins .sk.on { background: var(--accent); color: var(--on-accent, #fff); font-weight: 600; }
  #skins .demo { margin-left: auto; color: var(--faint); }
  [data-skin=crt], [data-skin=pixel] { --on-accent: #03190a; }
  [data-skin=neon] #skins .sk, [data-skin=crt] #skins .sk, [data-skin=pixel] #skins .sk { border-radius: 0; }
  [data-skin=comic] #skins .sk { box-shadow: 0 0 0 1.5px #111; font-weight: 700; }

  /* ---- aurora 极光（默认）：深色玻璃，背后缓慢漂移的极光 ---- */
  :root:not([data-skin]) #fx, [data-skin=aurora] #fx { inset: -30%; filter: blur(46px); opacity: .3; will-change: transform;
    background: radial-gradient(30% 30% at 20% 20%, #6d7cff, transparent 70%), radial-gradient(30% 30% at 80% 30%, #ff6fb1, transparent 70%), radial-gradient(35% 35% at 50% 85%, #3ad0ff, transparent 70%);
    animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6%, -4%) rotate(14deg) scale(1.08); } }

  /* ---- neon 霓虹：赛博 HUD，网格扫描线、霓虹描边、等宽字 ---- */
  [data-skin=neon] { --bg: rgba(9, 5, 22, .92); --edge: rgba(255, 43, 214, .45); --fg: #ece9ff; --dim: rgba(205, 200, 255, .58); --faint: rgba(0, 240, 255, .5);
    --accent: #ff2bd6; --accent2: #00f0ff; --accent3: #f9f871; --field: transparent; --kbd: transparent; --kbd-fg: #00f0ff;
    --sel: linear-gradient(90deg, rgba(255, 43, 214, .24), rgba(0, 240, 255, .04)); --sel-line: transparent; --idle: #39ff9e; --busy: #00f0ff; --wait: #ff2bd6;
    --chip-s: 100%; --chip-l: 68%; --r: 2px; }
  [data-skin=neon] #box { box-shadow: inset 0 0 0 1px var(--edge), inset 0 0 30px rgba(255, 43, 214, .16); }
  [data-skin=neon] #fx { background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px), linear-gradient(transparent 60%, rgba(255, 43, 214, .1)),
    linear-gradient(90deg, rgba(0, 240, 255, .07) 1px, transparent 1px) 0 0 / 34px 34px, linear-gradient(rgba(0, 240, 255, .05) 1px, transparent 1px) 0 0 / 34px 34px; }
  [data-skin=neon] #fx::after { content: ''; position: absolute; left: 0; right: 0; height: 70px; top: -70px; background: linear-gradient(transparent, rgba(0, 240, 255, .08), transparent); animation: sweep 5s linear infinite; }
  @keyframes sweep { to { top: 110%; } }
  [data-skin=neon] .mark { background: transparent; color: var(--accent2); border: 1.5px solid var(--accent2); border-radius: 2px; box-shadow: 0 0 10px var(--accent2), inset 0 0 8px rgba(0, 240, 255, .5); text-shadow: 0 0 6px var(--accent2); }
  [data-skin=neon] textarea { text-shadow: 0 0 10px rgba(233, 230, 255, .35); }
  [data-skin=neon] #filter { border: 1px solid rgba(0, 240, 255, .3); border-radius: 0; font-family: var(--mono); }
  [data-skin=neon] #target { border-radius: 0; border: 1px solid var(--accent); box-shadow: 0 0 10px rgba(255, 43, 214, .4); }
  [data-skin=neon] #list li.sec { display: flex; align-items: center; gap: 8px; color: var(--accent); font-family: var(--mono); letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255, 43, 214, .8); }
  [data-skin=neon] #list li.sec::before { content: '//'; }
  [data-skin=neon] #list li.sec::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255, 43, 214, .6), transparent); }
  [data-skin=neon] #list li.sec .n { background: none; color: var(--accent); padding: 0; margin: 0; }
  [data-skin=neon] #list li.hl { border-left: 2px solid var(--accent); box-shadow: -4px 0 18px rgba(255, 43, 214, .5); transition: transform .16s cubic-bezier(.7, 0, .3, 1), height .16s; }
  [data-skin=neon] #list li.hl::before { display: none; }
  [data-skin=neon] .num { background: none; box-shadow: none; width: 22px; color: rgba(0, 240, 255, .55); }
  [data-skin=neon] li.sel .num { background: none; color: var(--accent2); text-shadow: 0 0 8px var(--accent2); }
  [data-skin=neon] li.sel .t { text-shadow: 0 0 10px rgba(255, 255, 255, .5); }
  [data-skin=neon] .chip { border-radius: 0; border: 1px solid currentColor; background: none; font: 10.5px/15px var(--mono); text-transform: uppercase; text-shadow: 0 0 6px currentColor; padding: 0 6px; }
  [data-skin=neon] .prov { width: auto; background: none; font: 700 10px var(--mono); letter-spacing: 1px; }
  [data-skin=neon] .prov svg { display: none; }
  [data-skin=neon] .prov::after { content: attr(data-n); }
  [data-skin=neon] .prov.claude { color: #ff9a6b; } [data-skin=neon] .prov.codex { color: #bb99ff; }
  [data-skin=neon] .sub { font-family: var(--mono), "PingFang SC"; font-size: 11.5px; }
  [data-skin=neon] .who { font-size: 0; padding: 0; background: none; }
  [data-skin=neon] .who::before { content: '>>'; font: 11px var(--mono); color: var(--accent2); }
  [data-skin=neon] .who.it::before { content: '<<'; color: var(--accent3); }
  [data-skin=neon] .st { font: 600 10.5px var(--mono); letter-spacing: 1px; padding: 0 6px; border: 1px solid currentColor; text-transform: uppercase; }
  [data-skin=neon] .st i { display: none; }
  [data-skin=neon] .st.idle { color: var(--idle); }
  [data-skin=neon] .st.busy { color: var(--busy); text-shadow: 0 0 8px var(--busy); animation: glitch 2.6s steps(1) infinite; }
  [data-skin=neon] .st.waiting { color: #0b0016; background: var(--wait); border-color: var(--wait); box-shadow: 0 0 14px var(--wait); animation: blink 1s steps(1) infinite; }
  [data-skin=neon] .st.unknown { color: var(--faint); border-style: dashed; }
  @keyframes glitch { 0%, 92%, 100% { transform: none; } 93% { transform: translate(2px, -1px); text-shadow: -2px 0 #ff2bd6, 2px 0 #00f0ff; } 95% { transform: translate(-2px, 1px); } }
  [data-skin=neon] .time { font-family: var(--mono); color: rgba(0, 240, 255, .45); }
  [data-skin=neon] #hint { font-family: var(--mono), "PingFang SC"; color: rgba(0, 240, 255, .5); }
  [data-skin=neon] kbd { background: none; box-shadow: none; padding: 0; color: var(--accent2); }
  [data-skin=neon] kbd::before { content: '['; } [data-skin=neon] kbd::after { content: ']'; }

  /* ---- crt 荧光终端：分层用色差拉开——标题薄荷白、项目琥珀、正文中绿、辅助暗绿 ---- */
  [data-skin=crt] { --bg: #050b07; --edge: #16391e; --fg: #dcffe6; --dim: #45c46f; --faint: #2b8a4b; --accent: #5cff8f; --accent2: #5cff8f; --accent3: #ffcf5a;
    --field: transparent; --kbd: transparent; --kbd-fg: #9dffbf; --sel: #5cff8f; --sel-line: transparent; --idle: #5cff8f; --busy: #7fe8ff; --wait: #ffcf5a;
    --font: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; --r: 3px; }
  [data-skin=crt] #box { text-shadow: 0 0 4px rgba(92, 255, 143, .4); box-shadow: inset 0 0 0 1px var(--edge), inset 0 0 50px rgba(0, 0, 0, .85); animation: flicker 5s infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .99; } 48% { opacity: .95; } 49% { opacity: 1; } }
  [data-skin=crt] #fx { z-index: 2; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .2) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0, 0, 0, .55)); }
  [data-skin=crt] #fx::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent, rgba(92, 255, 143, .05) 50%, transparent) 0 0 / 100% 160px; animation: roll 6s linear infinite; }
  @keyframes roll { to { background-position: 0 480px; } }
  [data-skin=crt] .mark { background: none; box-shadow: none; width: auto; color: var(--accent); font-size: 0; }
  [data-skin=crt] .mark::after { content: '$'; font: 700 18px var(--mono); }
  [data-skin=crt] textarea { font-size: 17px; color: var(--fg); }
  [data-skin=crt] #filter { padding-left: 0; border-radius: 0; border-bottom: 1px dashed var(--faint); }
  [data-skin=crt] #target { border-radius: 0; background: none; border: 1px solid var(--accent); }
  [data-skin=crt] #list li.sec { color: var(--faint); }
  [data-skin=crt] #list li.sec::before { content: '── '; } [data-skin=crt] #list li.sec::after { content: ' ──'; }
  [data-skin=crt] #list li.sec .n { background: none; color: var(--dim); padding: 0; }
  [data-skin=crt] #list li.hl { box-shadow: 0 0 14px rgba(92, 255, 143, .5); transition: none; }
  [data-skin=crt] #list li.hl::before { display: none; }
  [data-skin=crt] #list li.sel, [data-skin=crt] #list li.sel * { color: #03190a !important; text-shadow: none !important; }
  [data-skin=crt] .num { display: flex; width: auto; background: none; box-shadow: none; color: #9dffbf; font-weight: 400; }
  [data-skin=crt] .num::before { content: '['; } [data-skin=crt] .num::after { content: ']'; }
  [data-skin=crt] li.sel .num { background: none; }
  [data-skin=crt] .t { font-weight: 700; color: var(--fg); }
  [data-skin=crt] .chip { background: none; padding: 0; color: var(--accent3); font-size: 12px; text-shadow: 0 0 4px rgba(255, 207, 90, .45); }
  [data-skin=crt] .chip::before { content: '@'; }
  [data-skin=crt] .prov { width: auto; background: none; color: var(--faint); font-size: 11.5px; }
  [data-skin=crt] .prov svg { display: none; } [data-skin=crt] .prov::after { content: '<' attr(data-n) '>'; }
  [data-skin=crt] .sub { font-size: 11.5px; }
  [data-skin=crt] .who { font-size: 0; padding: 0; background: none; margin-right: 6px; }
  [data-skin=crt] .who::before { content: '>'; font-size: 11.5px; color: var(--faint); }
  [data-skin=crt] .who.it::before { content: '<'; color: var(--busy); }
  [data-skin=crt] li.sel .who::before { color: inherit; }
  [data-skin=crt] .st i { display: none; }
  [data-skin=crt] .st::before { content: '['; } [data-skin=crt] .st::after { content: ']'; }

  let S = I18N.zh;
  input.placeholder = '';
  window.ntr.lang().then((l) => { S = I18N[l] || I18N.zh; input.placeholder = S.placeholder; render(); });
  // 皮肤：菜单栏「皮肤」里选，存在 settings.json；换了立即重排（各皮肤内边距不同，窗口高度跟着变）
  // 选皮肤（菜单栏「选择皮肤…」）：← → 实时把整个框换成那套皮肤并摆出示例任务列表，回车才保存；Esc、框被关掉都恢复原皮肤
  let skins = [], skinNow = 'aurora', pick = null; // pick：选皮肤中，{ i } 是正在预览的第几套
  const applySkin = (id) => { document.documentElement.dataset.skin = id; render(); };
  window.ntr.skin().then((s) => { skins = s.skins; skinNow = s.current; applySkin(s.current); });
  window.ntr.onSkin((id) => { skinNow = id; applySkin(id); });
  window.ntr.onSkinPick(() => {
    if (inflight || !skins.length) return;
    pick = { i: Math.max(0, skins.findIndex((x) => x.id === skinNow)) };
    items = S.sample.map((x, n) => ({ kind: 'session', provider: x.provider, sessionId: 'demo' + n, state: x.state,
      card: { title: x.title, project: x.project, reply: x.reply || null, last: x.last || null, updatedAt: x.mins ? new Date(Date.now() - x.mins * 60000).toISOString() : null },
      ...(x.prompt ? { prompt: x.prompt } : {}) }));
    mode = 'skin'; sel = 0; input.disabled = true; say('');
    filter.value = ''; filter.placeholder = S.filterPh;
    render();
  });
  const previewSkin = (i) => { pick.i = (i + skins.length) % skins.length; applySkin(skins[pick.i].id); };
  // 离开选皮肤（任何路径）：没保存就回到已保存的皮肤；调用方负责重排
  const endSkinPick = () => { if (!pick) return; pick = null; document.documentElement.dataset.skin = skinNow; };

  // mode: input（打字）| busy（等待结果）| choose（拿不准，选去处）| tasks（← 任务列表）| approve（目标停在审批/选择框，替它选）
  let mode = 'input', items = [], sel = 0, text = '', target = null;
  // approve 模式的选项框：{ question, context, options: [{label}] }，来自 CLI 的屏幕解析
  let ap = null;
  // 任务列表：running = 终端里开着的（按标签页顺序），recent = 其余最近的；items 是按筛选词过滤后可选的行
  let tasks = { running: [], recent: [] };
  const RECENT_SHOWN = 8; // 不筛选时"最近"只列这么多，筛选时在全部里找
  // inflight：请求已交给 CLI、结果未回；lastAction：上一次结果（决定再次唤起时是否恢复正文）
  let inflight = false, lastAction = null;

  const say = (s, err) => { msg.textContent = s || ''; msg.className = err ? 'err' : ''; };
  const reportSize = () => requestAnimationFrame(() => window.ntr.resize(Math.ceil(box.getBoundingClientRect().height)));
  const grow = () => {
    input.style.height = 'auto';
    const h = input.scrollHeight;
    input.style.height = Math.min(h, MAX_INPUT_PX) + 'px';
    input.style.overflowY = h > MAX_INPUT_PX ? 'auto' : 'hidden';
    reportSize();
  };
  const newTitle = (it) => S.newItem(it.provider, it.cwd ? it.cwd.split('/').pop() : '');
  const titleOf = (it) => (it.card ? it.card.title || it.card.last || S.untitled : it.viewTitle || it.provider + ':' + it.sessionId);
  const sessionLabel = (it) => (it.kind === 'new' ? newTitle(it) : [titleOf(it), it.card && it.card.project, it.provider].filter(Boolean).join(' · '));
  // 回复多是 Markdown：列表里只要文字，去掉标题井号、加粗星号、行内代码的反引号
  const oneLine = (s) => String(s || '').replace(/^#+\s*/gm, '').replace(/\*\*|`/g, '').replace(/\s+/g, ' ').trim();
  const minutesAgo = (iso) => Math.round((Date.now() - Date.parse(iso)) / 60000);
  const taskText = (it) => [it.card && it.card.title, it.card && it.card.project, it.card && it.card.last, it.prompt && it.prompt.question, it.viewTitle, it.provider].filter(Boolean).join(' ').toLowerCase();
  function filterTasks() {
    const q = filter.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const hit = (it) => q.every((w) => taskText(it).includes(w));
    const run = tasks.running.filter(hit);
    const rec = tasks.recent.filter(hit).slice(0, q.length ? 30 : RECENT_SHOWN);
    items = [...run, ...rec]; sel = Math.min(sel, Math.max(0, items.length - 1));
  }

  // 目标停在审批/选择框：把问题与选项摆进框里，人替它选（数字键/回车），选完 CLI 代按 ↓×n-1+↵、
  // 等框消失再把输入框里拿着的话自动发过去。认不出选项时只给"确认当前高亮项"（回车）。
  function enterApprove(p) {
    ap = { question: p && p.question, context: p && p.context, options: p && p.options && p.options.length ? p.options : [{ label: S.apDefault }] };
    items = ap.options; sel = 0; mode = 'approve';
    input.disabled = true;
    say([ap.context, ap.question].filter(Boolean).join('\n') || S.apNoQ);
    render();
  }

  // 列表行：编号 · 标题 + 项目标签 + 工具徽标 · 副行（谁说的 + 内容）· 右侧状态或时间。样式由皮肤决定
  const PROV_ICON = {
    claude: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2 7.6 7.4-2.8-5.6 5.7 5.6 5.7-7.4-2.8-2 7.6-2-7.6-7.4 2.8 5.6-5.7-5.6-5.7 7.4 2.8z"/></svg>',
    codex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M13 18h6"/></svg>',
  };
  const hue = (s) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let rowN = 0; // 本次渲染的第几行（入场动画错开用）
  function row(i, { title, project, provider, who, sub, more, state, stateText, time }) {
    const li = el('li', [i === sel && 'sel', state].filter(Boolean).join(' '));
    li.style.setProperty('--d', rowN++);
    li.appendChild(el('span', 'num', i < 9 ? String(i + 1) : ''));
    const main = el('div', 'main'), top = el('div', 'top');
    top.appendChild(el('span', 't', title));
    if (project) { const c = el('span', 'chip', project); c.style.setProperty('--h', hue(project)); top.appendChild(c); }
    if (provider) { const p = el('span', 'prov ' + provider); p.dataset.n = provider; p.innerHTML = PROV_ICON[provider] || ''; top.appendChild(p); }
    main.appendChild(top);
    if (sub) {
      const b = el('div', more ? 'sub more' : 'sub');
      if (who) b.appendChild(el('span', 'who ' + who, who === 'it' ? S.whoIt : S.whoYou));
      b.appendChild(document.createTextNode(sub));
      main.appendChild(b);
    }
    li.appendChild(main);
    if (state || time) {
      const m = el('div', 'meta');
      if (state) { const st = el('span', 'st ' + state); st.appendChild(el('i')); st.appendChild(document.createTextNode(stateText)); m.appendChild(st); }
      else m.appendChild(el('span', 'time', time));
      li.appendChild(m);
    }
    list.appendChild(li);
  }
  // 开着的任务看它最后说了什么（进行到哪了）；停在审批框的看它要批什么；没开着的看你上次说了什么、多久以前
  function taskRow(it, i) {
    const c = it.card;
    let who = null, sub = '', time = '';
    if (it.prompt) sub = [it.prompt.context, it.prompt.question].filter(Boolean).join(' ');
    else if (c && it.state) { if (c.reply) { who = 'it'; sub = oneLine(c.reply); } else if (c.last) { who = 'you'; sub = oneLine(c.last); } }
    else if (c) { if (c.last) { who = 'you'; sub = oneLine(c.last); } if (c.updatedAt) time = S.ago(minutesAgo(c.updatedAt)); }
    const state = it.prompt ? 'waiting' : it.state || null;
    row(i, { title: titleOf(it), project: c && c.project, provider: it.provider, who, sub, more: true, state, stateText: it.prompt ? S.apState : state && (S.state[state] || state), time });
  }

  function renderTasks() {
    let sec = null;
    items.forEach((it, i) => {
      const s = it.state ? 'run' : 'rec';
      if (s !== sec) {
        sec = s;
        const h = el('li', 'sec', s === 'run' ? S.secRunning : S.secRecent);
        if (s === 'run') h.appendChild(el('span', 'n', String(items.filter((x) => x.state).length)));
        h.style.setProperty('--d', rowN++);
        list.appendChild(h);
      }
      taskRow(it, i);
    });
    if (!items.length) list.appendChild(el('li', 'sec', S.noMatch));
    list.classList.add('scroll');
    const selEl = list.querySelector('li.sel');
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  // 选中光块常驻在列表里（不随每次重建而删），换行时用过渡滑过去；列表从无到有时各行依次淡入
  const hl = el('li', 'hl'); hl.setAttribute('aria-hidden', 'true'); hl.hidden = true; list.appendChild(hl);
  function placeHl() {
    const s = list.querySelector('li.sel');
    hl.hidden = !s;
    if (s) { hl.style.transform = `translateY(${s.offsetTop}px)`; hl.style.height = s.offsetHeight + 'px'; }
  }
  let enterTimer = null;

  function render() {
    const wasEmpty = list.classList.contains('none');
    for (const c of [...list.children]) if (c !== hl) c.remove();
    list.classList.remove('scroll');
    rowN = 0;
    filter.hidden = mode !== 'tasks' && mode !== 'skin';
    if (mode === 'tasks') {
      renderTasks();
      hint.innerHTML = S.taskKeys(!!input.value.trim()).map(([k, v]) => `<span><kbd>${k}</kbd>${v}</span>`).join('');
    } else if (mode === 'skin') {
      renderTasks();
      hint.innerHTML = S.skinKeys(skins.length).map(([k, v]) => `<span><kbd>${k}</kbd>${v}</span>`).join('');
    } else if (mode === 'approve') {
      items.forEach((it, i) => row(i, { title: it.label }));
      hint.innerHTML = S.apKeys.map(([k, v]) => `<span><kbd>${k}</kbd>${v}</span>`).join('');
    } else if (mode === 'choose') {
      items.forEach((it, i) => {
        if (it.kind === 'new') return row(i, { title: newTitle(it), provider: it.provider });
        const c = it.card;
        row(i, { title: titleOf(it), project: c && c.project, provider: it.provider, sub: it.lastInput ? S.last + it.lastInput : (c && c.last ? S.recent + c.last : '') });
      });
      hint.innerHTML = S.chooseKeys.map(([k, v]) => `<span><kbd>${k}</kbd>${v}</span>`).join('');
    } else {
      hint.textContent = '';
    }
    const empty = list.children.length === 1;
    list.classList.toggle('none', empty);
    if (wasEmpty && !empty) { list.classList.add('enter'); clearTimeout(enterTimer); enterTimer = setTimeout(() => list.classList.remove('enter'), 700); }
    placeHl();
    skinsEl.hidden = mode !== 'skin';
    if (mode === 'skin') {
      skinsEl.textContent = '';
      skinsEl.appendChild(el('span', 'lb', S.skinLabel));
      skins.forEach((x, i) => skinsEl.appendChild(el('span', i === pick.i ? 'sk on' : 'sk', x.name)));
      skinsEl.appendChild(el('span', 'demo', S.skinDemo));
    }
    targetEl.hidden = !target;
    if (target) {
      targetEl.textContent = S.to + sessionLabel(target);
      const h = document.createElement('span'); h.className = 'hint'; h.textContent = S.escCancel; targetEl.appendChild(h);
    }
    reportSize();
  }

  function reset() {
    endSkinPick();
    mode = 'input'; items = []; sel = 0; text = ''; target = null; lastAction = null;
    input.value = ''; input.disabled = false; say('');
    grow(); render(); input.focus();
  }
  const backToInput = (value) => {
    endSkinPick();
    mode = 'input'; items = []; sel = 0; input.disabled = false; say('');
    if (value !== undefined) input.value = value;
    grow(); render(); input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  };
  // 再次唤起：没送出去的话一律保留（输入到一半、停在候选列表、发送失败），只有成功送达后才清空；
  // 请求还在路上时不动界面，结果回来照常显示（拿不准的候选不能因为重开窗口而丢掉）。
  function onShow() {
    if (inflight) return void reportSize();
    if (mode === 'input' || mode === 'tasks' || mode === 'skin') return backToInput();
    // 再次唤起：选项框可能已经过时（人在终端里处理过），拿不准/审批都退回输入，没发出去的话原样保留
    if (mode === 'choose' || mode === 'approve' || lastAction === 'failed') return backToInput(input.value);
    reset();
  }
  window.ntr.onShow(onShow);
  // 语音入口拿不准去处时主进程调用：框里没有没发出去的话才放进去（两件事拼成一句会送错），返回是否放下
  window.__ntrPrefill = (t) => {
    const unsent = mode === 'input' || mode === 'tasks' ? !!input.value.trim() : mode === 'choose' || mode === 'approve' || inflight || lastAction === 'failed';
    if (unsent) return false;
    backToInput(t);
    return true;
  };

  // 语音唤醒：与快捷键同一个输入框。唤醒时框里若有没发出去的话就记下来，语音的字接在后面且不自动发送（两件事拼成一句会送错）；
  // 否则字边说边出，说完倒计时自动发送。按任意键停下倒计时改成手动，框被关掉则这一轮作废。
  const VOICE_SECS = 3;
  let voice = null; // { base, auto, timer }
  const voiceEnd = () => { if (voice && voice.timer) clearInterval(voice.timer); voice = null; };
  const voiceText = (t) => { input.value = voice.base ? voice.base + '\n' + t : t; grow(); input.setSelectionRange(input.value.length, input.value.length); };
  window.ntr.onVoice((e) => {
    if (e.state === 'cancel') return voiceEnd();
    if (inflight) return;
    if (e.state === 'wake') {
      voiceEnd();
      if (mode !== 'input') backToInput();
      const base = input.value.trim();
      voice = { base, auto: !base, timer: null };
      return say(S.vListening);
    }
    if (!voice) return;
    if (e.state === 'partial') return voiceText(e.text);
    if (e.state === 'final') {
      voiceText(e.text);
      if (!voice.auto) { voiceEnd(); window.ntr.voiceDraft(); return say(S.vDraft); }
      let left = VOICE_SECS;
      say(S.vCountdown(left));
      voice.timer = setInterval(() => {
        if (--left > 0) return say(S.vCountdown(left));
        voiceEnd(); send(true);
      }, 1000);
      return;
    }
    if (e.state === 'timeout') {
      voiceEnd();
      if (input.value.trim()) return say('');
      say(S.vTimeout);
      setTimeout(() => { if (!voice && !input.value.trim() && mode === 'input') window.ntr.cancel(); }, 1500);
    }
  });

  // 结果反馈动画：送达闪光、失败抖动（具体样子由皮肤决定）
  const flashResult = (cls) => {
    document.body.classList.remove('ok', 'bad'); void document.body.offsetWidth;
    document.body.classList.add(cls); setTimeout(() => document.body.classList.remove(cls), 1000);
  };
  async function run(p) {
    mode = 'busy'; input.disabled = true; items = []; render();
    inflight = true; document.body.classList.add('thinking');
    const r = await p;
    inflight = false; lastAction = r.action; document.body.classList.remove('thinking');
    if (r.action === 'failed') flashResult('bad');
    else if ((r.action === 'wrote' || r.action === 'answered' || r.action === 'opened') && !r.nativePrompt) flashResult('ok');
    if (r.action === 'clarify') {
      const sessions = r.options.map((o) => ({ kind: 'session', ...o }));
      const fallbackNew = { kind: 'new', provider: (r.suggestNew && r.suggestNew.provider) || 'claude', cwd: r.suggestNew ? r.suggestNew.cwd : null };
      if (r.ranked && r.ranked.length) {
        // 按 Router 的顺序列出（含各项目内的"新建"及其目录）；会话项沿用 options 里带卡片的那份
        const byKey = new Map(sessions.map((x) => [x.provider + ':' + x.sessionId, x]));
        items = r.ranked.map((o) => (o.kind === 'new' ? { kind: 'new', provider: o.provider, cwd: o.cwd || null } : byKey.get(o.provider + ':' + o.sessionId))).filter(Boolean);
        for (const x of sessions) if (!items.includes(x)) items.push(x);
        if (!items.some((x) => x.kind === 'new')) items.push(fallbackNew);
      } else items = r.suggestNew ? [fallbackNew, ...sessions] : [...sessions, fallbackNew];
      sel = 0; mode = 'choose';
      say(r.reason ? S.notSent(r.reason) : S.unsure);
      render();
      return;
    }
    if (r.action === 'awaiting-approval') {
      // 正文没送、留在框里：目标设为这个任务，选项摆出来，人替它选，选完自动把这句话发过去
      target = { kind: 'session', provider: r.provider, sessionId: r.sessionId, ...(r.card ? { card: r.card } : {}) };
      enterApprove(r.prompt);
      return;
    }
    say(r.line, r.action === 'failed');
    render();
  }

  function send(viaVoice) {
    text = input.value.trim();
    if (!text) return;
    say(S.routing);
    if (target && target.kind === 'new') run(window.ntr.pick({ text, new: true, provider: target.provider, cwd: target.cwd }));
    else if (target) run(window.ntr.pick({ text, provider: target.provider, sessionId: target.sessionId }));
    else run(window.ntr.submit(text, viaVoice));
  }

  function choose(it) {
    if (!it) return;
    if (it.nativeWaiting) { say(S.nativeWait); return; }
    if (mode === 'approve') {
      // 替目标选第 n 项；输入框里拿着的话由 CLI 在选项框消失后自动发过去
      const option = items.indexOf(it) + 1;
      say(S.sending);
      run(window.ntr.pick({ text: input.value.trim(), provider: target.provider, sessionId: target.sessionId, answer: option }));
      return;
    }
    if (mode === 'choose') {
      say(it.kind === 'new' ? S.creating : S.sending);
      run(it.kind === 'new' ? window.ntr.pick({ text, new: true, provider: it.provider, cwd: it.cwd }) : window.ntr.pick({ text, provider: it.provider, sessionId: it.sessionId }));
      return;
    }
    // 任务列表：停在审批框的任务直接在框里选（正文先拿着）；其余按原逻辑
    if (it.prompt) { target = it; filter.value = ''; return enterApprove(it.prompt); }
    target = it; mode = 'input'; items = []; filter.value = '';
    if (input.value.trim()) return send();
    say(''); render(); input.focus();
  }
  // ⌘N：在选中任务所在的项目里新开一个会话（同一个工具）
  const newInProject = (it) => it && it.card && choose({ kind: 'new', provider: it.provider, cwd: it.card.cwd });

  async function openTasks() {
    mode = 'tasks'; items = []; sel = 0; filter.value = ''; say(S.loadingTasks); render();
    filter.placeholder = S.filterPh; filter.focus();
    const t = await window.ntr.tasks();
    if (mode !== 'tasks') return;
    tasks = { running: t.running.map((x) => ({ kind: 'session', ...x })), recent: t.recent.map((x) => ({ kind: 'session', ...x })) };
    if (!tasks.running.length && !tasks.recent.length) { mode = 'input'; say(S.noTasks); render(); input.focus(); return; }
    filterTasks(); say(''); render();
  }
  const closeList = () => { mode = 'input'; items = []; filter.value = ''; say(''); render(); input.focus(); };

  input.addEventListener('input', () => grow());
  filter.addEventListener('input', () => { if (mode === 'tasks') { sel = 0; filterTasks(); render(); } });

  window.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return; // 输入法组字中，回车/方向键交给输入法
    const k = e.key;
    if (voice) { voiceEnd(); say(''); } // 语音这一轮里按了键：人在电脑前，停下倒计时，这个键照常生效
    if (mode === 'skin') {
      e.preventDefault();
      if (k === 'Escape') return backToInput();
      if (k === 'Enter') { skinNow = skins[pick.i].id; window.ntr.setSkin(skinNow); return backToInput(); }
      if (k === 'ArrowLeft' || k === 'ArrowRight') return previewSkin(pick.i + (k === 'ArrowRight' ? 1 : -1));
      if (/^[1-9]$/.test(k) && skins[Number(k) - 1]) return previewSkin(Number(k) - 1);
      if (k === 'ArrowDown' || k === 'ArrowUp') { sel = (sel + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); }
      return;
    }
    if (k === 'Escape') {
      e.preventDefault();
      if (mode === 'tasks') { if (filter.value) { filter.value = ''; filterTasks(); return render(); } return closeList(); }
      if (mode === 'approve') { ap = null; return backToInput(input.value); }
      if (mode === 'input' && target) { target = null; return render(); }
      return window.ntr.cancel();
    }
    if (mode === 'choose' || mode === 'tasks' || mode === 'approve') {
      if (mode === 'tasks' && (k === 'n' || k === 'N') && e.metaKey) { e.preventDefault(); return newInProject(items[sel]); }
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        if (items.length) { sel = (sel + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); }
      } else if (k === 'Enter') {
        e.preventDefault(); choose(items[sel]);
      } else if (/^[1-9]$/.test(k) && items[Number(k) - 1]) {
        e.preventDefault(); sel = Number(k) - 1; choose(items[sel]);
      } else if (mode === 'choose' && (k === 'n' || k === 'N')) {
        e.preventDefault(); choose(items.find((x) => x.kind === 'new'));
      } else if (mode === 'tasks' && (k === 'ArrowRight' || k === 'ArrowLeft') && !filter.value) {
        e.preventDefault(); closeList();
      } else if (mode !== 'tasks') {
        e.preventDefault(); // 选择中不往被禁用的输入框里打字
      }
      return;
    }
    if (mode !== 'input') return;
    if (k === 'Enter' && !e.shiftKey) { e.preventDefault(); return send(); }
    if (k === 'ArrowLeft' && input.selectionStart === 0 && input.selectionEnd === 0) { e.preventDefault(); return openTasks(); }
    if (k === 'Backspace' && !input.value && target) { e.preventDefault(); target = null; return render(); }
  }, true);

  // 验收探针（入口 stdin 控制通道读取界面状态用；只读）
  window.__ntrProbe = () => ({
    mode, inflight, lastAction, sel, items: items.map((it) => (it.kind === 'new' ? 'NEW' : it.sessionId ? `${it.provider}:${it.sessionId}` : `OPT:${it.label}`)),
    target: target ? (target.kind === 'new' ? `new:${target.provider}:${target.cwd}` : `${target.provider}:${target.sessionId}`) : null, filter: filter.value,
    ap: mode === 'approve' && ap ? { q: ap.question, ctx: ap.context, n: ap.options.length } : null,
    value: input.value, inputHeight: input.getBoundingClientRect().height, lineHeight: parseFloat(getComputedStyle(input).lineHeight),
    boxHeight: box.getBoundingClientRect().height, skin: document.documentElement.dataset.skin || null, msg: msg.textContent, hint: hint.textContent, voice: voice ? { auto: voice.auto, counting: !!voice.timer } : null,
  });
</script>
