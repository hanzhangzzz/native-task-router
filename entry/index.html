<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  /* 底色交给 macOS 原生毛玻璃（BrowserWindow vibrancy），页面本身全透明；圆角与阴影由系统绘制。 */
  :root { --fg: #f4f5f8; --dim: rgba(235, 238, 245, .62); --faint: rgba(235, 238, 245, .4); --row: rgba(255, 255, 255, .06);
          --accent: #8b97ff; --accent2: #5fd4ff; --accent3: #ff7ab8; --sel: rgba(139, 151, 255, .22); --err: #ff8f8f; --kbd: rgba(255, 255, 255, .1); }
  @media (prefers-color-scheme: light) {
    :root { --fg: #15171f; --dim: rgba(21, 23, 31, .62); --faint: rgba(21, 23, 31, .42); --row: rgba(0, 0, 0, .04);
            --accent: #4d5ce0; --sel: rgba(77, 92, 224, .14); --err: #c93636; --kbd: rgba(0, 0, 0, .07); }
  }
  html, body { margin: 0; background: transparent; font: 15px -apple-system, "PingFang SC", sans-serif; color: var(--fg); -webkit-user-select: none; }
  #box { position: relative; padding: 15px 18px 14px; }
  /* 流动光边：只在路由判断进行中出现并旋转，其余时间不跑任何动画 */
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  #box::before { content: ''; position: absolute; inset: 0; border-radius: 12px; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), var(--accent), var(--accent2), var(--accent3), var(--accent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .25s; }
  body.thinking #box::before { opacity: .95; animation: flow 2.4s linear infinite; }
  @keyframes flow { to { --a: 360deg; } }
  .row { display: flex; align-items: flex-start; gap: 12px; }
  .row textarea { margin-top: 1px; }
  .mark { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 7px; display: grid; place-items: center;
    font: 700 12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -1px; color: #fff;
    background: linear-gradient(135deg, var(--accent2), var(--accent) 55%, var(--accent3)); box-shadow: 0 2px 8px rgba(110, 120, 255, .35); }
  #target { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px; padding: 3px 10px; border-radius: 999px;
    background: var(--sel); color: var(--accent); font-size: 12.5px; }
  #target[hidden] { display: none; }
  #target .hint { color: var(--faint); }
  textarea { display: block; flex: 1; width: 100%; box-sizing: border-box; background: transparent; border: 0; outline: 0; resize: none; overflow-y: hidden;
    color: inherit; caret-color: var(--accent); font: inherit; font-size: 20px; line-height: 1.4; padding: 0; margin: 0; }
  textarea::placeholder { color: var(--faint); }
  #msg { margin: 10px 0 0 38px; white-space: pre-wrap; color: var(--dim); font-size: 13px; line-height: 1.5; }
  #msg:empty { display: none; }
  #msg.err { color: var(--err); }
  #list { list-style: none; margin: 10px 0 0; padding: 0; }
  #list:empty { display: none; }
  #list li { position: relative; padding: 8px 12px 8px 14px; border-radius: 9px; font-size: 14px; line-height: 1.4; transition: background .12s; }
  #list li + li { margin-top: 2px; }
  #list li .sub { color: var(--dim); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list li.sel { background: var(--sel); }
  #list li.sel .sub.more { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #list li.sec { padding: 6px 12px 2px 14px; font-size: 11.5px; color: var(--faint); letter-spacing: .5px; }
  #list li .top { display: flex; gap: 8px; align-items: baseline; }
  #list li .top .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li .st { flex: none; font-size: 11.5px; color: var(--dim); }
  #list li .st::before { content: '●'; margin-right: 4px; font-size: 9px; vertical-align: 1px; }
  #list li .st.idle::before { color: #4cd38a; } #list li .st.busy::before { color: var(--accent2); } #list li .st.waiting::before { color: #ffb347; } #list li .st.unknown::before { color: var(--faint); }
  #list.scroll { max-height: 430px; overflow-y: auto; }
  #filter { display: block; width: 100%; box-sizing: border-box; margin: 10px 0 0; padding: 5px 10px; border: 0; outline: 0; border-radius: 7px;
    background: var(--row); color: inherit; font: inherit; font-size: 13px; caret-color: var(--accent); }
  #filter[hidden] { display: none; }
  #filter::placeholder { color: var(--faint); }
  #list li.sel::before { content: ''; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
  #hint { margin: 10px 0 0; color: var(--faint); font-size: 11.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  #hint:empty { display: none; }
  kbd { font: 11px ui-monospace, "SF Mono", Menlo, monospace; padding: 1px 5px; border-radius: 4px; background: var(--kbd); color: var(--dim); margin-right: 3px; }
</style>
<div id="box">
  <div id="target" hidden></div>
  <div class="row"><span class="mark">›_</span><textarea id="in" rows="1" autofocus autocomplete="off" spellcheck="false"></textarea></div>
  <div id="msg"></div>
  <input id="filter" hidden autocomplete="off" spellcheck="false">
  <ul id="list"></ul>
  <div id="hint"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const input = $('in'), msg = $('msg'), list = $('list'), hint = $('hint'), targetEl = $('target'), box = $('box'), filter = $('filter');
  const MAX_INPUT_PX = 220;
  // 界面文案：语言由主进程决定（NTR_LANG 或 macOS 首选语言）；路由原因按已知文本翻译，未知的不显示原文
  const I18N = {
    zh: {
      placeholder: '说一句话，回车发送 · Shift+回车换行 · ← 任务列表', untitled: '(无标题)',
      newItem: (p, dir) => `新建 ${p} 会话 · ${dir || '新目录'}`, last: '上次：', recent: '最近：',
      chooseKeys: [['↑↓', '选择'], ['↵', '确认'], ['1–9', '直选'], ['N', '新建'], ['Esc', '取消']],
      taskKeys: (hasText) => [['↑↓ 1–9', '选择'], ['↵', hasText ? '发给它' : '设为发送目标'], ['⌘N', '在该项目新开'], ['Esc', '返回']],
      to: '→ 发往 ', escCancel: 'Esc 取消', notSent: (r) => `没有自动发送：${r}`, unsure: '拿不准，选一个去处：',
      routing: '处理中…', creating: '新建中…', sending: '送达中…', loadingTasks: '读取任务…', noTasks: '没有找到会话',
      secRunning: (n) => `正在运行 · ${n}`, secRecent: '最近', filterPh: '打字筛选项目、标题…', noMatch: '没有匹配的任务',
      state: { idle: '空闲', busy: '运行中', waiting: '等待中', unknown: '状态未知' }, it: '它：', you: '你：',
      ago: (m) => (m < 60 ? `${Math.max(1, m)} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`),
      vListening: '🎙 在听，说你要派的活…', vCountdown: (n) => `🎙 ${n} 秒后发送 · 任意键修改 · Esc 取消`,
      vDraft: '🎙 框里原有没发出去的话，语音这句接在后面，不自动发送', vTimeout: '🎙 没听到',
    },
    en: {
      placeholder: 'Say one sentence · ↵ send · ⇧↵ newline · ← tasks', untitled: '(untitled)',
      newItem: (p, dir) => `New ${p} session · ${dir || 'new folder'}`, last: 'Last: ', recent: 'Recent: ',
      chooseKeys: [['↑↓', 'select'], ['↵', 'send'], ['1–9', 'pick'], ['N', 'new'], ['Esc', 'cancel']],
      taskKeys: (hasText) => [['↑↓ 1–9', 'select'], ['↵', hasText ? 'send to it' : 'set as target'], ['⌘N', 'new in this project'], ['Esc', 'back']],
      to: '→ to ', escCancel: 'Esc cancel',
      notSent: (r) => `Not sent automatically: ${{
        '输入太短或没有具体内容，无法确定去处': 'too short to tell where it goes',
        '没有可用的模型': 'no router model available',
        '模型失败、超时或输出无效': 'the router model failed or timed out',
        '模型首选不一致': 'the router was not consistent',
        '置信度低于阈值': 'confidence below the threshold',
      }[r] || 'not sure where it goes'}. Pick one:`,
      unsure: 'Not sure where this goes. Pick one:',
      routing: 'Routing…', creating: 'Creating…', sending: 'Sending…', loadingTasks: 'Loading tasks…', noTasks: 'No sessions found',
      secRunning: (n) => `Running · ${n}`, secRecent: 'Recent', filterPh: 'Type to filter by project or title…', noMatch: 'No matching tasks',
      state: { idle: 'idle', busy: 'working', waiting: 'waiting', unknown: 'unknown' }, it: 'Agent: ', you: 'You: ',
      ago: (m) => (m < 60 ? `${Math.max(1, m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`),
      vListening: '🎙 Listening. Say your task…', vCountdown: (n) => `🎙 Sending in ${n}s · any key to edit · Esc to cancel`,
      vDraft: "🎙 The box already had an unsent message; this was added after it and won't send by itself", vTimeout: "🎙 Didn't hear anything",
    },
  };
  let S = I18N.zh;
  input.placeholder = '';
  window.ntr.lang().then((l) => { S = I18N[l] || I18N.zh; input.placeholder = S.placeholder; render(); });

  // mode: input（打字）| busy（等待结果）| choose（拿不准，选去处）| tasks（← 任务列表）
  let mode = 'input', items = [], sel = 0, text = '', target = null;
  // 任务列表：running = 终端里开着的（按标签页顺序），recent = 其余最近的；items 是按筛选词过滤后可选的行
  let tasks = { running: [], recent: [] };
  const RECENT_SHOWN = 8; // 不筛选时"最近"只列这么多，筛选时在全部里找
  // inflight：请求已交给 CLI、结果未回；lastAction：上一次结果（决定再次唤起时是否恢复正文）
  let inflight = false, lastAction = null;

  const say = (s, err) => { msg.textContent = s || ''; msg.className = err ? 'err' : ''; };
  const reportSize = () => requestAnimationFrame(() => window.ntr.resize(Math.ceil(box.getBoundingClientRect().height)));
  const grow = () => {
    input.style.height = 'auto';
    const h = input.scrollHeight;
    input.style.height = Math.min(h, MAX_INPUT_PX) + 'px';
    input.style.overflowY = h > MAX_INPUT_PX ? 'auto' : 'hidden';
    reportSize();
  };
  const sessionLabel = (it) => {
    if (it.kind === 'new') return S.newItem(it.provider, it.cwd ? it.cwd.split('/').pop() : '');
    const c = it.card;
    const title = c ? (c.title || c.last || S.untitled) : (it.viewTitle || it.provider + ':' + it.sessionId);
    return `${title} · ${c ? c.project : ''} · ${it.provider}`;
  };
  // 回复多是 Markdown：列表里只要文字，去掉标题井号、加粗星号、行内代码的反引号
  const oneLine = (s) => String(s || '').replace(/^#+\s*/gm, '').replace(/\*\*|`/g, '').replace(/\s+/g, ' ').trim();
  const minutesAgo = (iso) => Math.round((Date.now() - Date.parse(iso)) / 60000);
  // 开着的任务看它最后说了什么（进行到哪了）；没开着的看你上次说了什么、多久以前
  const taskSub = (it) => {
    const c = it.card;
    if (!c) return '';
    if (it.state) return c.reply ? S.it + oneLine(c.reply) : (c.last ? S.you + oneLine(c.last) : '');
    return [c.last ? S.you + oneLine(c.last) : '', c.updatedAt ? S.ago(minutesAgo(c.updatedAt)) : ''].filter(Boolean).join(' · ');
  };
  const taskText = (it) => [it.card && it.card.title, it.card && it.card.project, it.card && it.card.last, it.viewTitle, it.provider].filter(Boolean).join(' ').toLowerCase();
  function filterTasks() {
    const q = filter.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const hit = (it) => q.every((w) => taskText(it).includes(w));
    const run = tasks.running.filter(hit);
    const rec = tasks.recent.filter(hit).slice(0, q.length ? 30 : RECENT_SHOWN);
    items = [...run, ...rec]; sel = Math.min(sel, Math.max(0, items.length - 1));
  }
  const itemHtml = (it) => {
    if (it.kind === 'new') return { main: S.newItem(it.provider, it.cwd ? it.cwd.split('/').pop() : ''), sub: '' };
    return { main: sessionLabel(it), sub: it.lastInput ? S.last + it.lastInput : (it.card && it.card.last ? S.recent + it.card.last : '') };
  };

  function renderTasks() {
    let sec = null;
    items.forEach((it, i) => {
      const s = it.state ? 'run' : 'rec';
      if (s !== sec) {
        sec = s;
        const h = document.createElement('li'); h.className = 'sec';
        h.textContent = s === 'run' ? S.secRunning(items.filter((x) => x.state).length) : S.secRecent;
        list.appendChild(h);
      }
      const li = document.createElement('li');
      if (i === sel) li.className = 'sel';
      const top = document.createElement('div'); top.className = 'top';
      const t = document.createElement('span'); t.className = 't'; t.textContent = `${i < 9 ? i + 1 + '. ' : ''}${sessionLabel(it)}`; top.appendChild(t);
      if (it.state) { const st = document.createElement('span'); st.className = 'st ' + it.state; st.textContent = S.state[it.state] || it.state; top.appendChild(st); }
      li.appendChild(top);
      const sub = taskSub(it);
      if (sub) { const b = document.createElement('div'); b.className = 'sub more'; b.textContent = sub; li.appendChild(b); }
      list.appendChild(li);
    });
    if (!items.length) { const li = document.createElement('li'); li.className = 'sec'; li.textContent = S.noMatch; list.appendChild(li); }
    list.classList.add('scroll');
    const selEl = list.querySelector('li.sel');
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  function render() {
    list.textContent = '';
    list.classList.remove('scroll');
    filter.hidden = mode !== 'tasks';
    if (mode === 'tasks') {
      renderTasks();
      hint.innerHTML = S.taskKeys(!!input.value.trim()).map(([k, v]) => `<span><kbd>${k}</kbd>${v}</span>`).join('');
    } else if (mode === 'choose') {
      items.forEach((it, i) => {
        const li = document.createElement('li');
        if (i === sel) li.className = 'sel';
        const { main, sub } = itemHtml(it);
        const a = document.createElement('div'); a.textContent = `${i + 1}. ${main}`; li.appendChild(a);
        if (sub) { const b = document.createElement('div'); b.className = 'sub'; b.textContent = sub; li.appendChild(b); }
        list.appendChild(li);
      });
      hint.innerHTML = S.chooseKeys.map(([k, v]) => `<span><kbd>${k}</kbd>${v}</span>`).join('');
    } else {
      hint.textContent = '';
    }
    targetEl.hidden = !target;
    if (target) {
      targetEl.textContent = S.to + sessionLabel(target);
      const h = document.createElement('span'); h.className = 'hint'; h.textContent = S.escCancel; targetEl.appendChild(h);
    }
    reportSize();
  }

  function reset() {
    mode = 'input'; items = []; sel = 0; text = ''; target = null; lastAction = null;
    input.value = ''; input.disabled = false; say('');
    grow(); render(); input.focus();
  }
  const backToInput = (value) => {
    mode = 'input'; items = []; sel = 0; input.disabled = false; say('');
    if (value !== undefined) input.value = value;
    grow(); render(); input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  };
  // 再次唤起：没送出去的话一律保留（输入到一半、停在候选列表、发送失败），只有成功送达后才清空；
  // 请求还在路上时不动界面，结果回来照常显示（拿不准的候选不能因为重开窗口而丢掉）。
  function onShow() {
    if (inflight) return void reportSize();
    if (mode === 'input' || mode === 'tasks') return backToInput();
    if (mode === 'choose' || lastAction === 'failed') return backToInput(text);
    reset();
  }
  window.ntr.onShow(onShow);
  // 语音入口拿不准去处时主进程调用：框里没有没发出去的话才放进去（两件事拼成一句会送错），返回是否放下
  window.__ntrPrefill = (t) => {
    const unsent = mode === 'input' || mode === 'tasks' ? !!input.value.trim() : mode === 'choose' || inflight || lastAction === 'failed';
    if (unsent) return false;
    backToInput(t);
    return true;
  };

  // 语音唤醒：与快捷键同一个输入框。唤醒时框里若有没发出去的话就记下来，语音的字接在后面且不自动发送（两件事拼成一句会送错）；
  // 否则字边说边出，说完倒计时自动发送。按任意键停下倒计时改成手动，框被关掉则这一轮作废。
  const VOICE_SECS = 3;
  let voice = null; // { base, auto, timer }
  const voiceEnd = () => { if (voice && voice.timer) clearInterval(voice.timer); voice = null; };
  const voiceText = (t) => { input.value = voice.base ? voice.base + '\n' + t : t; grow(); input.setSelectionRange(input.value.length, input.value.length); };
  window.ntr.onVoice((e) => {
    if (e.state === 'cancel') return voiceEnd();
    if (inflight) return;
    if (e.state === 'wake') {
      voiceEnd();
      if (mode !== 'input') backToInput();
      const base = input.value.trim();
      voice = { base, auto: !base, timer: null };
      return say(S.vListening);
    }
    if (!voice) return;
    if (e.state === 'partial') return voiceText(e.text);
    if (e.state === 'final') {
      voiceText(e.text);
      if (!voice.auto) { voiceEnd(); window.ntr.voiceDraft(); return say(S.vDraft); }
      let left = VOICE_SECS;
      say(S.vCountdown(left));
      voice.timer = setInterval(() => {
        if (--left > 0) return say(S.vCountdown(left));
        voiceEnd(); send(true);
      }, 1000);
      return;
    }
    if (e.state === 'timeout') {
      voiceEnd();
      if (input.value.trim()) return say('');
      say(S.vTimeout);
      setTimeout(() => { if (!voice && !input.value.trim() && mode === 'input') window.ntr.cancel(); }, 1500);
    }
  });

  async function run(p) {
    mode = 'busy'; input.disabled = true; items = []; render();
    inflight = true; document.body.classList.add('thinking');
    const r = await p;
    inflight = false; lastAction = r.action; document.body.classList.remove('thinking');
    if (r.action === 'clarify') {
      const sessions = r.options.map((o) => ({ kind: 'session', ...o }));
      const fallbackNew = { kind: 'new', provider: (r.suggestNew && r.suggestNew.provider) || 'claude', cwd: r.suggestNew ? r.suggestNew.cwd : null };
      if (r.ranked && r.ranked.length) {
        // 按 Router 的顺序列出（含各项目内的"新建"及其目录）；会话项沿用 options 里带卡片的那份
        const byKey = new Map(sessions.map((x) => [x.provider + ':' + x.sessionId, x]));
        items = r.ranked.map((o) => (o.kind === 'new' ? { kind: 'new', provider: o.provider, cwd: o.cwd || null } : byKey.get(o.provider + ':' + o.sessionId))).filter(Boolean);
        for (const x of sessions) if (!items.includes(x)) items.push(x);
        if (!items.some((x) => x.kind === 'new')) items.push(fallbackNew);
      } else items = r.suggestNew ? [fallbackNew, ...sessions] : [...sessions, fallbackNew];
      sel = 0; mode = 'choose';
      say(r.reason ? S.notSent(r.reason) : S.unsure);
      render();
      return;
    }
    say(r.line, r.action === 'failed');
    render();
  }

  function send(viaVoice) {
    text = input.value.trim();
    if (!text) return;
    say(S.routing);
    if (target && target.kind === 'new') run(window.ntr.pick({ text, new: true, provider: target.provider, cwd: target.cwd }));
    else if (target) run(window.ntr.pick({ text, provider: target.provider, sessionId: target.sessionId }));
    else run(window.ntr.submit(text, viaVoice));
  }

  function choose(it) {
    if (!it) return;
    if (mode === 'choose') {
      say(it.kind === 'new' ? S.creating : S.sending);
      run(it.kind === 'new' ? window.ntr.pick({ text, new: true, provider: it.provider, cwd: it.cwd }) : window.ntr.pick({ text, provider: it.provider, sessionId: it.sessionId }));
      return;
    }
    // 任务列表：已有正文就直接发过去；否则设为发送目标，回到输入
    target = it; mode = 'input'; items = []; filter.value = '';
    if (input.value.trim()) return send();
    say(''); render(); input.focus();
  }
  // ⌘N：在选中任务所在的项目里新开一个会话（同一个工具）
  const newInProject = (it) => it && it.card && choose({ kind: 'new', provider: it.provider, cwd: it.card.cwd });

  async function openTasks() {
    mode = 'tasks'; items = []; sel = 0; filter.value = ''; say(S.loadingTasks); render();
    filter.placeholder = S.filterPh; filter.focus();
    const t = await window.ntr.tasks();
    if (mode !== 'tasks') return;
    tasks = { running: t.running.map((x) => ({ kind: 'session', ...x })), recent: t.recent.map((x) => ({ kind: 'session', ...x })) };
    if (!tasks.running.length && !tasks.recent.length) { mode = 'input'; say(S.noTasks); render(); input.focus(); return; }
    filterTasks(); say(''); render();
  }
  const closeList = () => { mode = 'input'; items = []; filter.value = ''; say(''); render(); input.focus(); };

  input.addEventListener('input', () => grow());
  filter.addEventListener('input', () => { if (mode === 'tasks') { sel = 0; filterTasks(); render(); } });

  window.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return; // 输入法组字中，回车/方向键交给输入法
    const k = e.key;
    if (voice) { voiceEnd(); say(''); } // 语音这一轮里按了键：人在电脑前，停下倒计时，这个键照常生效
    if (k === 'Escape') {
      e.preventDefault();
      if (mode === 'tasks') { if (filter.value) { filter.value = ''; filterTasks(); return render(); } return closeList(); }
      if (mode === 'input' && target) { target = null; return render(); }
      return window.ntr.cancel();
    }
    if (mode === 'choose' || mode === 'tasks') {
      if (mode === 'tasks' && (k === 'n' || k === 'N') && e.metaKey) { e.preventDefault(); return newInProject(items[sel]); }
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        if (items.length) { sel = (sel + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); }
      } else if (k === 'Enter') {
        e.preventDefault(); choose(items[sel]);
      } else if (/^[1-9]$/.test(k) && items[Number(k) - 1]) {
        e.preventDefault(); choose(items[Number(k) - 1]);
      } else if (mode === 'choose' && (k === 'n' || k === 'N')) {
        e.preventDefault(); choose(items.find((x) => x.kind === 'new'));
      } else if (mode === 'tasks' && (k === 'ArrowRight' || k === 'ArrowLeft') && !filter.value) {
        e.preventDefault(); closeList();
      } else if (mode === 'choose') {
        e.preventDefault(); // 选择中不往被禁用的输入框里打字
      }
      return;
    }
    if (mode !== 'input') return;
    if (k === 'Enter' && !e.shiftKey) { e.preventDefault(); return send(); }
    if (k === 'ArrowLeft' && input.selectionStart === 0 && input.selectionEnd === 0) { e.preventDefault(); return openTasks(); }
    if (k === 'Backspace' && !input.value && target) { e.preventDefault(); target = null; return render(); }
  }, true);

  // 验收探针（入口 stdin 控制通道读取界面状态用；只读）
  window.__ntrProbe = () => ({
    mode, inflight, lastAction, sel, items: items.map((it) => (it.kind === 'new' ? 'NEW' : `${it.provider}:${it.sessionId}`)),
    target: target ? (target.kind === 'new' ? `new:${target.provider}:${target.cwd}` : `${target.provider}:${target.sessionId}`) : null, filter: filter.value,
    value: input.value, inputHeight: input.getBoundingClientRect().height, lineHeight: parseFloat(getComputedStyle(input).lineHeight),
    boxHeight: box.getBoundingClientRect().height, msg: msg.textContent, hint: hint.textContent, voice: voice ? { auto: voice.auto, counting: !!voice.timer } : null,
  });
</script>
