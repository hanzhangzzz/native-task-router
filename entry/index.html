<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; font: 15px -apple-system, "PingFang SC", sans-serif; color: #f2f2f2; }
  #box { margin: 6px; padding: 12px 14px; border-radius: 12px; background: rgba(32, 32, 36, 0.96); border: 1px solid #555; }
  #target { margin-bottom: 6px; font-size: 13px; color: #8ab4ff; }
  #target .hint { color: #888; margin-left: 6px; }
  textarea { display: block; width: 100%; box-sizing: border-box; background: transparent; border: 0; outline: 0; resize: none; overflow-y: hidden;
             color: inherit; font: inherit; font-size: 18px; line-height: 1.45; padding: 0; margin: 0; }
  #msg { margin-top: 8px; white-space: pre-wrap; color: #bbb; font-size: 13px; line-height: 1.5; }
  #msg:empty { display: none; }
  #msg.err { color: #ff8a80; }
  #list { list-style: none; margin: 8px 0 0; padding: 0; }
  #list:empty { display: none; }
  #list li { padding: 6px 8px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
  #list li .sub { color: #999; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list li.sel { background: #3a5bd9; }
  #list li.sel .sub { color: #dde4ff; }
  #hint { margin-top: 6px; color: #777; font-size: 12px; }
  #hint:empty { display: none; }
</style>
<div id="box">
  <div id="target" hidden></div>
  <textarea id="in" rows="1" placeholder="说一句话，回车发送 · Shift+回车换行 · ← 历史会话" autofocus autocomplete="off" spellcheck="false"></textarea>
  <div id="msg"></div>
  <ul id="list"></ul>
  <div id="hint"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const input = $('in'), msg = $('msg'), list = $('list'), hint = $('hint'), targetEl = $('target'), box = $('box');
  const MAX_INPUT_PX = 220;

  // mode: input（打字）| busy（等待结果）| choose（Jev 拿不准，选去处）| history（← 历史会话）
  let mode = 'input', items = [], sel = 0, text = '', target = null;
  // inflight：请求已交给 CLI、结果未回；lastAction：上一次结果（决定再次唤起时是否恢复正文）
  let inflight = false, lastAction = null;

  const say = (s, err) => { msg.textContent = s || ''; msg.className = err ? 'err' : ''; };
  const reportSize = () => requestAnimationFrame(() => window.jev.resize(Math.ceil(box.getBoundingClientRect().height) + 12));
  const grow = () => {
    input.style.height = 'auto';
    const h = input.scrollHeight;
    input.style.height = Math.min(h, MAX_INPUT_PX) + 'px';
    input.style.overflowY = h > MAX_INPUT_PX ? 'auto' : 'hidden';
    reportSize();
  };
  const sessionLabel = (it) => {
    const c = it.card;
    const title = c ? (c.title || c.last || '(无标题)') : it.provider + ':' + it.sessionId;
    return `${title} · ${c ? c.project : ''} · ${it.provider}`;
  };
  const itemHtml = (it) => {
    if (it.kind === 'new') return { main: `新建 ${it.provider} 会话 · ${it.cwd ? it.cwd.split('/').pop() : '新目录'}`, sub: '' };
    return { main: sessionLabel(it), sub: it.lastInput ? `上次：${it.lastInput}` : (it.card && it.card.last ? `最近：${it.card.last}` : '') };
  };

  function render() {
    list.textContent = '';
    if (mode === 'choose' || mode === 'history') {
      items.forEach((it, i) => {
        const li = document.createElement('li');
        if (i === sel) li.className = 'sel';
        const { main, sub } = itemHtml(it);
        const a = document.createElement('div'); a.textContent = `${i + 1}. ${main}`; li.appendChild(a);
        if (sub) { const b = document.createElement('div'); b.className = 'sub'; b.textContent = sub; li.appendChild(b); }
        list.appendChild(li);
      });
      hint.textContent = mode === 'choose'
        ? '↑↓ 选择 · 回车确认 · 1–9 直选 · N 新建 · Esc 取消'
        : (input.value.trim() ? '↑↓ 选择 · 回车直接发往该会话 · → / Esc 返回' : '↑↓ 选择 · 回车设为发送目标 · → / Esc 返回');
    } else {
      hint.textContent = '';
    }
    targetEl.hidden = !target;
    if (target) {
      targetEl.textContent = `→ 发往 ${sessionLabel(target)}`;
      const h = document.createElement('span'); h.className = 'hint'; h.textContent = 'Esc 取消，改由 Jev 判断'; targetEl.appendChild(h);
    }
    reportSize();
  }

  function reset() {
    mode = 'input'; items = []; sel = 0; text = ''; target = null; lastAction = null;
    input.value = ''; input.disabled = false; say('');
    grow(); render(); input.focus();
  }
  const backToInput = (value) => {
    mode = 'input'; items = []; sel = 0; input.disabled = false; say('');
    if (value !== undefined) input.value = value;
    grow(); render(); input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  };
  // 再次唤起：没送出去的话一律保留（输入到一半、停在候选列表、发送失败），只有成功送达后才清空；
  // 请求还在路上时不动界面，结果回来照常显示（拿不准的候选不能因为重开窗口而丢掉）。
  function onShow() {
    if (inflight) return void reportSize();
    if (mode === 'input' || mode === 'history') return backToInput();
    if (mode === 'choose' || lastAction === 'failed') return backToInput(text);
    reset();
  }
  window.jev.onShow(onShow);

  async function run(p) {
    mode = 'busy'; input.disabled = true; items = []; render();
    inflight = true;
    const r = await p;
    inflight = false; lastAction = r.action;
    if (r.action === 'clarify') {
      const sessions = r.options.map((o) => ({ kind: 'session', ...o }));
      const fallbackNew = { kind: 'new', provider: (r.suggestNew && r.suggestNew.provider) || 'claude', cwd: r.suggestNew ? r.suggestNew.cwd : null };
      items = r.suggestNew ? [fallbackNew, ...sessions] : [...sessions, fallbackNew];
      sel = 0; mode = 'choose';
      say(r.reason ? `没有自动发送：${r.reason}` : '拿不准，选一个去处：');
      render();
      return;
    }
    say(r.line, r.action === 'failed');
    render();
  }

  function send() {
    text = input.value.trim();
    if (!text) return;
    say('处理中…');
    if (target) run(window.jev.pick({ text, provider: target.provider, sessionId: target.sessionId }));
    else run(window.jev.submit(text));
  }

  function choose(it) {
    if (!it) return;
    if (mode === 'choose') {
      say(it.kind === 'new' ? '新建中…' : '送达中…');
      run(it.kind === 'new' ? window.jev.pick({ text, new: true, provider: it.provider, cwd: it.cwd }) : window.jev.pick({ text, provider: it.provider, sessionId: it.sessionId }));
      return;
    }
    // history：已有正文就直接发过去；否则设为发送目标，回到输入
    if (input.value.trim()) { target = it; mode = 'input'; items = []; send(); return; }
    target = it; mode = 'input'; items = []; say(''); render(); input.focus();
  }

  async function openHistory() {
    mode = 'history'; items = []; say('读取历史会话…'); render();
    const h = await window.jev.history();
    if (mode !== 'history') return;
    if (!h.length) { mode = 'input'; say('还没有发送过的会话'); render(); input.focus(); return; }
    items = h.map((x) => ({ kind: 'session', ...x })); sel = 0; say(''); render();
  }
  const closeList = () => { mode = 'input'; items = []; say(''); render(); input.focus(); };

  input.addEventListener('input', () => { grow(); if (mode === 'history') render(); });

  window.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return; // 输入法组字中，回车/方向键交给输入法
    const k = e.key;
    if (k === 'Escape') {
      e.preventDefault();
      if (mode === 'history') return closeList();
      if (mode === 'input' && target) { target = null; return render(); }
      return window.jev.cancel();
    }
    if (mode === 'choose' || mode === 'history') {
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        if (items.length) { sel = (sel + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); }
      } else if (k === 'Enter') {
        e.preventDefault(); choose(items[sel]);
      } else if (/^[1-9]$/.test(k) && items[Number(k) - 1]) {
        e.preventDefault(); choose(items[Number(k) - 1]);
      } else if (mode === 'choose' && (k === 'n' || k === 'N')) {
        e.preventDefault(); choose(items.find((x) => x.kind === 'new'));
      } else if (mode === 'history' && k === 'ArrowRight') {
        e.preventDefault(); closeList();
      } else if (mode === 'choose') {
        e.preventDefault(); // 选择中不往被禁用的输入框里打字
      }
      return;
    }
    if (mode !== 'input') return;
    if (k === 'Enter' && !e.shiftKey) { e.preventDefault(); return send(); }
    if (k === 'ArrowLeft' && input.selectionStart === 0 && input.selectionEnd === 0) { e.preventDefault(); return openHistory(); }
    if (k === 'Backspace' && !input.value && target) { e.preventDefault(); target = null; return render(); }
  }, true);

  // 验收探针（入口 stdin 控制通道读取界面状态用；只读）
  window.__jevProbe = () => ({
    mode, inflight, lastAction, sel, items: items.map((it) => (it.kind === 'new' ? 'NEW' : `${it.provider}:${it.sessionId}`)),
    target: target ? `${target.provider}:${target.sessionId}` : null,
    value: input.value, inputHeight: input.getBoundingClientRect().height, lineHeight: parseFloat(getComputedStyle(input).lineHeight),
    boxHeight: box.getBoundingClientRect().height, msg: msg.textContent, hint: hint.textContent,
  });
</script>
